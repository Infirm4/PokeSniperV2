<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Oportunidades · PokeSniper</title>
  <link rel="stylesheet" href="opportunities.css">
  <script defer src="market-core.js"></script>
  <script defer src="opportunities.js"></script>
  <script defer src="vendor/briaoale/especies.js"></script>
  <script defer src="vendor/briaoale/pve-power.js"></script>
  <script defer src="vendor/briaoale/market-bonuses.js"></script>
  <script defer src="vendor/briaoale/central.js"></script>
  <script defer src="vendor/briaoale/nota.js"></script>
  <script defer src="vendor/briaoale/pve-pricing.js"></script>
  <script defer src="pricing-model.js"></script>
  <script defer src="liquidity.js"></script>
  <script defer src="market-diagnostics.js"></script>
  <script defer src="market-smoke.js"></script>
  <script defer src="history-trace.js"></script>
  <script defer src="public-gems.js"></script>
  <script defer src="coins-history.js"></script>
  <script defer src="market-backtest.js"></script>
  <script defer src="market-store.js"></script>
  <script defer src="sales-backup.js"></script>
  <script defer src="opportunities-popup.js"></script>
</head>
<body>
  <header><h1>PokeSniper</h1><button id="open" type="button">Abrir PokéIdle</button></header>
  <div class="actions notice-controls">
    <button id="toggle-notices" type="button" disabled>Ligar avisos</button>
    <span id="notice-status" class="offer-meta" role="status"></span>
  </div>
  <details>
    <summary>Filtros e notificações</summary>
    <form id="settings">
      <div class="fields">
        <label>Moeda<select name="currency"><option value="gold">Coins</option><option value="orb">Gemas</option><option value="all">Todas</option></select></label>
        <label>Desconto mínimo (%)<input name="discount" type="number" min="0" max="99" required></label>
      </div>
      <div class="actions">
        <button id="save-filters" type="submit" disabled>Salvar filtros</button>
      </div>
      <span id="save-status" role="status"></span>
    </form>
  </details>
  <section class="opportunity-history" aria-labelledby="opportunities-heading">
    <h2 id="opportunities-heading">Oportunidades</h2>
    <p id="status" role="status">Carregando avisos…</p>
    <ul id="offers"></ul>
  </section>
  <details>
    <summary>Diagnóstico da versão</summary>
    <button type="button" id="copy-smart-coins">Copiar cache de Coins do Smart Market</button>
    <p class="offer-meta">Também é possível importar um backup JSON de outro perfil.</p>
    <input type="file" id="coins-import" accept=".json,application/json" aria-label="Backup de vendas em Coins">
    <p role="status" class="offer-meta" id="coins-import-status"></p>
    <div class="actions"><button type="button" id="sales-backup-now">Sincronizar vendas completas com o Sheets</button></div>
    <label>Restaurar vendas do CSV da planilha
      <input type="file" id="sales-backup-restore" accept=".csv,text/csv">
    </label>
    <p id="sales-backup-status" role="status" class="offer-meta"></p>
    <p id="diagnostics" class="offer-meta"></p>
    <p class="offer-meta">Mostra o estado da conexão, os testes locais e os avisos reais da fila. O relatório não inclui registros individuais.</p>
    <div class="actions">
      <button type="button" id="sample-sale">Ver uma venda do banco</button>
      <button type="button" id="run-diagnostics">Gerar relatório do mercado</button>
      <button type="button" id="test-purchase-review">Simular revisão de compra</button>
      <button type="button" id="run-backtest">Testar precisão com vendas locais</button>
      <button type="button" id="copy-diagnostics" disabled>Copiar resultado</button>
      <button type="button" id="download-diagnostics" disabled>Baixar diagnóstico (.json)</button>
    </div>
    <label>Pokémon para comparar em Gemas (opcional)
      <input id="gem-comparison-name" type="search" maxlength="100" placeholder="Ex.: Dragonite">
    </label>
    <div class="actions"><button type="button" id="compare-gem-attack-iv">Comparar ajuste de IV em Gemas</button></div>
    <p id="test-status" class="offer-meta" role="status"></p>
    <textarea id="diagnostic-report" aria-label="Resultado do diagnóstico" rows="10" readonly hidden></textarea>
  </details>
</body>
</html>
